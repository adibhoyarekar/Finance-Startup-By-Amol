<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Orders - FinMatrix</title>
  <meta name="description" content="Track your FinMatrix orders: credit reports, client files and bank auction bids.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#eceff4">
  <link rel="icon" type="image/svg+xml" href="images/logo-mark.svg?v=2">
  <link rel="stylesheet" href="styles.css?v=3">
  <link rel="stylesheet" href="app.css?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="orders.css?v=2">
  <script src="app-status.js?v=1"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/images/pwa/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="FinMatrix">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="/app-install.js?v=1"></script>
</head>
<body class="ap-body ox">
  <div class="ap">
    <aside class="ap-side" aria-label="My account">
      <a class="ap-brand" href="index.html"><img src="images/logo.svg?v=2" alt="FinMatrix" width="108" height="28"><small id="side-role">Customer</small></a>
      <p class="ap-navlabel first">Menu</p>
      <nav class="ap-nav" aria-label="Main" id="side-nav"></nav>
      <div class="ap-sidecard">
        <strong>Need help with an order?</strong>
        <p>Send us the Order ID and we will check it for you.</p>
        <a class="ap-btn is-sm" href="contact.html">Contact us</a>
      </div>
      <div class="ap-me">
        <span id="me-avatar"></span>
        <div style="min-width:0"><strong id="me-name"></strong><small id="me-role">Customer</small></div>
        <button type="button" data-logout aria-label="Log out" data-tip="Log out"><span data-ico="logout"></span></button>
      </div>
    </aside>

    <div class="ap-main">
      <header class="ap-top">
        <a class="ap-mlogo" href="index.html"><img src="images/logo.svg?v=2" alt="FinMatrix" width="100" height="26"></a>
        <p class="ap-title"><span id="top-area">My account</span> <span aria-hidden="true">&nbsp;/&nbsp;</span> <b>My orders</b></p>
        <div class="ap-topact" style="margin-left:auto">
          <button type="button" class="ap-btn is-icon" id="o-refresh" aria-label="Refresh statuses" data-tip="Refresh"><span data-ico="clock"></span></button>
          <a class="ap-btn is-primary ap-hide-m" id="o-new" href="cibil-score.html"><span data-ico="plus"></span>New CIBIL check</a>
        </div>
      </header>

      <main class="ap-content">
        <section class="ap-view is-on" aria-labelledby="o-h">
          <div class="ord-head">
            <div>
              <h1 id="o-h">My orders</h1>
              <p id="o-sub">Everything you have ordered or applied for, and where each one stands.</p>
            </div>
            <div class="ord-newwrap" id="o-newwrap"></div>
          </div>

          <div class="ox-kpis" id="o-kpis" role="group" aria-label="Order summary"></div>

          <div class="ox-bar">
            <label class="ox-search"><span data-ico="search"></span><input id="o-search" type="search" placeholder="Search by name, ID or product" aria-label="Search orders" autocomplete="off"></label>
            <button type="button" class="ox-filter" id="o-filter" aria-haspopup="dialog" aria-label="Filter orders">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
              <span class="ox-fbadge" id="o-fbadge" hidden>0</span>
            </button>
          </div>
          <div class="ox-tags" id="o-active"></div>

          <div class="ox-list" id="o-list" aria-live="polite"></div>
          <p class="ox-foot" id="o-foot"></p>
        </section>
      </main>
    </div>
  </div>

  <nav class="ap-tabbar" aria-label="Main" id="tabbar"></nav>

  <script src="raven-app.js?v=8"></script>
  <script src="app-shell.js?v=6"></script>
  <script src="auction-store.js?v=92"></script>
  <script src="cibil-report.js?v=2"></script>
  <script src="cibil-pay.js?v=3"></script>
  <script src="loan-track.js?v=1"></script>
  <script src="orders.js?v=3"></script>
</body>
</html>
