<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b2b5e">
  <title>You're offline - FinMatrix</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#334155;background:linear-gradient(160deg,#f5f8fc,#e8eef8);-webkit-font-smoothing:antialiased}
    .card{width:min(460px,100%);padding:34px 28px 28px;border-radius:22px;background:#fff;text-align:center;box-shadow:0 30px 70px -30px rgba(11,43,94,.45)}
    .brand{font-weight:800;font-size:18px;color:#0b2b5e;letter-spacing:-.01em;margin-bottom:22px}
    .brand span{color:#1d56b8}
    .ic{width:72px;height:72px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;background:#fef2f2;color:#ef4444}
    h1{margin:0 0 8px;color:#0f2a5c;font-size:24px;line-height:1.25}
    p{margin:0 auto;max-width:34ch;font-size:15px;line-height:1.5}
    ul{margin:18px auto 0;padding:14px 16px;max-width:320px;list-style:none;text-align:left;font-size:13.5px;background:#f5f8fc;border-radius:14px}
    li{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
    li::before{content:"";flex:none;width:6px;height:6px;margin-top:7px;border-radius:50%;background:#1d56b8}
    button{margin-top:22px;font:inherit;font-weight:600;font-size:15px;border:0;border-radius:12px;padding:12px 22px;min-height:46px;background:#0b2b5e;color:#fff;cursor:pointer}
    button:hover{background:#1d56b8}
    button:focus-visible{outline:3px solid #facc15;outline-offset:2px}
    button[disabled]{opacity:.7;cursor:default}
    .st{margin-top:12px;font-size:13px;color:#64748b;min-height:1.4em}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Fin<span>Matrix</span></div>
    <div class="ic" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.7"/><path d="M19 12.9a10 10 0 0 0-2.3-1.6"/><path d="M1.4 9a15 15 0 0 1 4.3-2.7"/><path d="M22.6 9A15 15 0 0 0 10.7 5"/><path d="M12 20h.01"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>We couldn't open this page because there's no internet connection.</p>
    <ul>
      <li>Check that Wi-Fi or mobile data is on</li>
      <li>Turn off Airplane mode</li>
      <li>Move closer to your router or try again</li>
    </ul>
    <button type="button" id="retry">Try again</button>
    <p class="st" id="st" role="status" aria-live="polite">This page will reload by itself when you're back online.</p>
  </main>
  <script>
    (function () {
      var b = document.getElementById('retry'), st = document.getElementById('st');
      function go() { location.reload(); }
      window.addEventListener('online', go);
      b.addEventListener('click', function () {
        b.disabled = true; b.textContent = 'Checking…';
        fetch('/images/rx/logo-mark.svg?v=2?ping=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
          .then(function (r) { if (r.ok) go(); else throw 0; })
          .catch(function () { b.disabled = false; b.textContent = 'Try again'; st.textContent = 'Still offline. We’ll keep trying.'; });
      });
    })();
  </script>
</body>
</html>
