    p{margin:0 auto;max-width:36ch;font-size:15px;line-height:1.5}
    .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}

    .pri:hover{background:#1d56b8}
    .sec{background:#f1f5f9;color:#0f2a5c}
